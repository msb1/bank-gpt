[project]
name = "bank-gpt"
version = "0.1.0"
description = "LLM discovery and deterministic computer-use replay for legacy banking UIs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "playwright==1.63.0",
    "pyjwt>=2.10,<3",
    "fastmcp>=4,<5",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bank_gpt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
