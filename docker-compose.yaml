services:
  playwright:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    init: true
    ipc: host
    user: pwuser
    working_dir: /home/pwuser
    command: /bin/sh -c "npx -y playwright@1.63.0 run-server --port 8080 --host 0.0.0.0"
    ports:
      - "8080:8080"
    restart: unless-stopped
